name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o armageddon ./cmd/armageddon

  e2e:
    # MVP acceptance test: real server as root with per-workspace users.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o armageddon ./cmd/armageddon
      - name: acceptance test
        run: |
          sudo install -m 0755 armageddon /usr/local/bin/armageddon
          sudo mkdir -p /srv && sudo chmod 755 /srv
          sudo -E env "PATH=$PATH" test/e2e/mvp.sh /usr/local/bin/armageddon

  e2e-ide:
    # Phase 5: code-server proxy (with a fake code-server), SSH endpoint via
    # the OpenSSH client, Git-provider credentials. Real server as root.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o armageddon ./cmd/armageddon
      - run: go build -o fake-code-server ./test/e2e/fakecodeserver
      - name: remote IDE acceptance test
        run: |
          sudo install -m 0755 armageddon /usr/local/bin/armageddon
          sudo mkdir -p /srv && sudo chmod 755 /srv
          sudo -E env "PATH=$PATH" test/e2e/ide.sh /usr/local/bin/armageddon "$PWD/fake-code-server"
